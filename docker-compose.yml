version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Python FastAPI ML Microservice (Port 5001)
  # -------------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: skyguard-ml-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - PYTHONUNBUFFERED=1
    volumes:
      - ml-data:/app/data
      - ml-models:/app/models_saved
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - skyguard-net

  # -------------------------------------------------------------
  # 2. Node.js Express & SQLite WAL API Gateway (Port 5000)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skyguard-backend-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ML_SERVICE_URL=http://ml-service:5001
      - DB_PATH=/app/data/skyguard.db
      - TELEMETRY_MODE=live_simulation
      - JWT_SECRET=skyguard_super_secret_jwt_signing_key_production_2026
      - TELEMETRY_INTERVAL_MS=3000
      - SSE_HEARTBEAT_MS=15000
    volumes:
      - backend-data:/app/data
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - skyguard-net

  # -------------------------------------------------------------
  # 3. React 18 / Vite / Nginx Production Frontend (Port 3000)
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyguard-frontend-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - skyguard-net

volumes:
  backend-data:
    driver: local
  ml-data:
    driver: local
  ml-models:
    driver: local

networks:
  skyguard-net:
    driver: bridge
